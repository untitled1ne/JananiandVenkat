plugins { id 'com.android.application' }

android {
    namespace 'com.untitled1ne.yezdimap'
    compileSdk 35

    defaultConfig {
        applicationId 'com.untitled1ne.yezdibridge'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '0.7-native-map'
        multiDexEnabled true
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-maps:19.0.0'
    implementation 'androidx.multidex:multidex:2.0.1'
}
