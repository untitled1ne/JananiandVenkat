name: Build Delivery Defender APK

on:
  workflow_dispatch:
  push:
    branches:
      - delivery-defender-apk-1.0.204

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify game asset
        run: |
          test -f app/src/main/assets/index.html || { echo "Missing app/src/main/assets/index.html"; exit 1; }

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DeliveryDefender-1.0.204-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
