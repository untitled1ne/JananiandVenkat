name: Build Yezdi Google Bridge APK
on:
  workflow_dispatch:
  push:
    branches: [ yezdi-google-bridge ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: android_bridge
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: YezdiGoogleBridge-debug-apk
          path: android_bridge/app/build/outputs/apk/debug/app-debug.apk
