plugins {
    id 'com.android.application'
}

android {
    namespace 'com.untitled1ne.yezdinav'
    compileSdk 35

    defaultConfig {
        applicationId "com.untitled1ne.yezdinav"
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName "0.7-native"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-maps:19.0.0'
}
